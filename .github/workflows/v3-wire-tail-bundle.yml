name: Wire v3 final fix bundle

on:
  push:
    branches:
      - v3.0.0-complete-rc

permissions:
  contents: write

jobs:
  wire-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0.0-complete-rc
      - name: Wire final bundle once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Mini-Soccer-Complete-v1.0.0-feedback/scripts/prepare-v2.mjs')
          s=p.read_text()
          line='  await run("v3-tail-bundle.mjs");\n'
          if line not in s:
            anchor='  await run("v3-profile-banner.mjs");\n'
            if anchor not in s:
              raise SystemExit('profile banner anchor missing')
            s=s.replace(anchor,anchor+line,1)
            p.write_text(s)
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "msc-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Mini-Soccer-Complete-v1.0.0-feedback/scripts/prepare-v2.mjs
          git commit -m "Wire v3 final fix bundle"
          git push origin HEAD:v3.0.0-complete-rc
