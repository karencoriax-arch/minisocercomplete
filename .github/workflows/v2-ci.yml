name: Mini Soccer Complete v2 CI

on:
  push:
    branches:
      - v2.0.0-economy-content
  pull_request:
    branches:
      - main

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Mini-Soccer-Complete-v1.0.0-feedback
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Mini-Soccer-Complete-v1.0.0-feedback/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Production build with v2 guards
        run: npm run build
      - name: Full automated test suite
        run: npm test
